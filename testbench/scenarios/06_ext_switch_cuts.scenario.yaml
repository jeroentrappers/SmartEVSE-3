# External "emergency" switch flips off while charging. The firmware
# must take the access_off path — C → C1 — and, after the C1 grace
# period expires (6 s of tick_1s counts), drop to B1 with both
# contactors open. Total duration ~6.5 s in virtual time; runs in
# milliseconds on the host.
#
# This is the contract that lets an installer wire a hardware
# interlock (door contact, PME relay, building shutoff) through the
# ExtSwitch pin and trust that it will actually stop the charger.
steps:
  - {"cmd": "reset"}
  - {"cmd": "set_mode", "mode": "Smart"}
  - {"cmd": "set_mains", "l1": 5.0, "l2": 5.0, "l3": 5.0}
  - {"cmd": "plug_ev", "connected": true}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "set_pilot_mv", "mv": 6000}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "ext_switch", "on": false}
  - {"cmd": "tick", "ms": 7000}
