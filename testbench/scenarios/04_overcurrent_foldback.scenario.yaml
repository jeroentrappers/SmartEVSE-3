# Load-balancing fold-back: the charger is happily advertising 16 A
# when house load spikes on the mains CT (15 A on every phase).
# Remaining headroom is 25 − 15 − 1 = 9 A, so the firmware must fold
# back the advertised current to 9 A without leaving state C. The duty
# cycle drops from 26.7% (16 A) to 15% (9 A).
#
# Regression target: a refactor that accidentally caches the advertised
# current instead of recomputing it per tick would fail this — the EV
# would keep drawing 16 A while the grid saw 22+ A on a 25 A main.
steps:
  - {"cmd": "reset"}
  - {"cmd": "set_mode", "mode": "Smart"}
  - {"cmd": "set_mains", "l1": 5.0, "l2": 5.0, "l3": 5.0}
  - {"cmd": "plug_ev", "connected": true}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "set_pilot_mv", "mv": 6000}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "set_mains", "l1": 15.0, "l2": 15.0, "l3": 15.0}
  - {"cmd": "tick", "ms": 100}
