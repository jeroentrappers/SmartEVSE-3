# EV is unplugged mid-charge. The pilot pulls back to +12 V, which must
# return the state machine to A and open both contactors in the same
# tick. A bug here — contactors staying closed while the connector is
# unplugged — is a shock hazard.
steps:
  - {"cmd": "reset"}
  - {"cmd": "set_mode", "mode": "Smart"}
  - {"cmd": "set_mains", "l1": 5.0, "l2": 5.0, "l3": 5.0}
  - {"cmd": "plug_ev", "connected": true}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "set_pilot_mv", "mv": 6000}
  - {"cmd": "tick", "ms": 500}
  - {"cmd": "plug_ev", "connected": false}
  - {"cmd": "tick", "ms": 100}
