# /Set/EnableC2 reject paths:
#   "5"     : digit but out of range (>4)
#   "AUTO"  : uppercase — firmware is case-sensitive, table has "Auto"
#   "-1"    : leading '-' is not a digit nor any table entry
#   ""      : empty payload
# First set EnableC2 to 3 (accepted digit) so we can assert the rejects
# do NOT revert/mutate it.
steps:
  - {"cmd": "reset"}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/EnableC2", "payload": "3"}
  - {"cmd": "snapshot"}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/EnableC2", "payload": "5"}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/EnableC2", "payload": "AUTO"}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/EnableC2", "payload": "-1"}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/EnableC2", "payload": ""}
  - {"cmd": "snapshot"}
