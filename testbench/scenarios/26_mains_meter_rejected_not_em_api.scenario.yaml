# /Set/MainsMeter reject-not-EM_API path — when the mains meter is
# configured as a directly-wired meter (not EM_API), the firmware
# refuses to accept externally-fed readings. The toggle lives on the
# harness (set_mains_meter_em_api=false) so the test can flip just this
# one condition without touching role or mode.
steps:
  - {"cmd": "reset"}
  - {"cmd": "set_mains", "l1": 4.0, "l2": 4.0, "l3": 4.0}
  - {"cmd": "set_mains_meter_em_api", "on": false}
  - {"cmd": "mqtt_set", "topic": "SmartEVSE-12345/Set/MainsMeter", "payload": "100:100:100"}
  - {"cmd": "snapshot"}
