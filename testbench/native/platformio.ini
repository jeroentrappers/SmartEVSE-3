; PlatformIO wrapper for the host-native testbench build.
;
; Under normal development the `Makefile` is faster. PIO here exists so
; CI / contributors with a PIO-only toolchain can `pio run -e native`
; and get the same binary.
;
; The real firmware envs live in SmartEVSE-3/platformio.ini; this file
; is deliberately orthogonal.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -I.
build_src_filter =
    +<src/>
    +<core/>
    +<harness/>
